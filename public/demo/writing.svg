<g font-family="Microsoft YaHei, sans-serif"><text x="44" y="55" font-size="18" fill="#8577aa" letter-spacing="4">WRITE / SHAPE / KEEP</text><text x="44" y="102" font-size="32" font-weight="700" fill="#302c48">把注意力留给内容。</text>
<g fill="#fff" stroke="#ded7ef" stroke-width="2"><rect x="44" y="139" width="320" height="238" rx="18"/><rect x="440" y="139" width="320" height="238" rx="18"/><rect x="836" y="139" width="320" height="238" rx="18"/></g>
