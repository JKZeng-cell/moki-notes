<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">把便签固定到桌面</title><desc id="desc">左侧列表中的便签通过图钉固定为独立桌面卡片，主窗口可收起到托盘。</desc>
<rect width="1200" height="440" rx="28" fill="#faf4e8"/>
<g font-family="Microsoft YaHei, sans-serif"><text x="44" y="56" font-size="18" fill="#9b8051" letter-spacing="4">PIN / FOCUS / REMEMBER</text><text x="44" y="105" font-size="32" fill="#463a29" font-weight="700">重要的事，不必藏在窗口里。</text>
<rect x="44" y="145" width="400" height="248" rx="18" fill="#fff" stroke="#e6dcc7" stroke-width="2"/><text x="68" y="183" font-size="21" fill="#605342">全部便签</text><rect x="66" y="204" width="356" height="92" rx="12" fill="#f2edff"/><text x="86" y="240" font-size="22" font-weight="600" fill="#55468e">读书会 · 今天的提醒</text><text x="86" y="274" font-size="18" fill="#85749f">准备资料，记录讨论结论</text><path d="M393 218v24m-7-18 7-6 7 6m-14 8h14" fill="none" stroke="#7965b7" stroke-width="2.5"/><text x="70" y="343" font-size="19" fill="#8a7960">点击列表或正文右上角的图钉</text>
<path d="M475 268h75m-13-12 13 12-13 12" fill="none" stroke="#b49b6c" stroke-width="3"/>
<rect x="584" y="145" width="338" height="248" rx="18" fill="#fff3cb" stroke="#e5d399" stroke-width="2"/><path d="M584 190h338" stroke="#e5d399"/><text x="606" y="176" font-size="17" fill="#86703b">MOKI便签</text><text x="858" y="177" font-size="26" fill="#86703b">＋</text><text x="606" y="228" font-size="24" font-weight="600" fill="#5a4828">今天的提醒</text><g font-size="21" fill="#7d683b"><text x="606" y="274">☑ 准备阅读资料</text><text x="606" y="311">☐ 记录讨论结论</text><text x="606" y="352" font-size="17">双击编辑 · 拖动摆放</text></g>
<rect x="962" y="222" width="192" height="118" rx="16" fill="#fff" stroke="#e6dcc7"/><circle cx="990" cy="253" r="6" fill="#64a18c"/><text x="1008" y="261" font-size="20" fill="#605342">托盘运行</text><text x="984" y="300" font-size="17" fill="#8a7960">收起主窗口</text><text x="44" y="424" font-size="15" fill="#a18a64">功能示意图 · 卡片内容与主窗口中的同一条便签同步</text></g></svg>
